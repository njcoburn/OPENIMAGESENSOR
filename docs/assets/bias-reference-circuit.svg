<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" role="img" aria-label="External resistor bias connections to existing on-chip mirrors">
<rect width="980" height="540" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#172033"><text x="40" y="40" font-size="25" font-weight="bold">Two board resistors replace the ideal current sources</text>
<text x="40" y="73" font-size="17">Functional connections · existing on-chip mirror transistors are retained</text>
<g stroke="#334155" stroke-width="3" fill="none"><path d="M150 130H800 M220 130V165 M220 235V285 M220 355V435 M690 130V170 M690 240V295 M690 365V435 M150 435H800"/>
<rect x="205" y="165" width="30" height="70" fill="white"/><rect x="675" y="295" width="30" height="70" fill="white"/>
<rect x="145" y="285" width="150" height="70" rx="8" fill="#dbeafe"/>
<rect x="615" y="170" width="150" height="70" rx="8" fill="#dbeafe"/>
<path d="M220 260H405 M690 268H870"/>
</g>
<g font-size="18"><text x="85" y="136">VDD</text><text x="84" y="441">GND</text>
<text x="265" y="190">Rcolumn</text><text x="265" y="217">5.1 MΩ, external</text>
<text x="320" y="250" fill="#075985">BIAS → column mirror</text>
<text x="165" y="315">NMOS reference</text><text x="175" y="341">on the chip</text>
<text x="628" y="199">PMOS reference</text><text x="645" y="226">on the chip</text>
<text x="726" y="319">Rbuffer</text><text x="726" y="346">49.9 kΩ, external</text>
<text x="727" y="258" fill="#075985">PREF → buffer mirror</text>
<text x="40" y="483">Simulation also includes 5 pF to ground at each bias pin (assumed pad/trace load).</text>
<text x="40" y="512">Current varies with device threshold, temperature, supply and resistor value; it is not regulated.</text>
</g></g></svg>
